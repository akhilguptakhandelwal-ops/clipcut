name: Build Android app

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install and assemble the web app
        working-directory: mobile
        run: |
          npm install
          npm run build:web
      - name: Create the Android project
        working-directory: mobile
        run: |
          npx cap add android
          npx cap sync android
      - name: Configure the app (memory, icon, version)
        working-directory: mobile
        run: |
          # ffmpeg.wasm needs a big heap for long videos
          sed -i 's/<application/<application android:largeHeap="true"/' android/app/src/main/AndroidManifest.xml
          # ClipCut icon in place of the default one (legacy square icons; drop the adaptive-icon XML so they are used)
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          sudo apt-get install -y -qq ffmpeg > /dev/null
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}; px=${pair##*:}
            for name in ic_launcher ic_launcher_round ic_launcher_foreground; do
              ffmpeg -y -v error -i ../installer/icon.png -vf "scale=${px}:${px}" android/app/src/main/res/mipmap-$d/$name.png
            done
          done
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
      - name: Build the APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Collect the APK
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk ClipCut.apk && ls -la ClipCut.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ClipCut-Android
          path: ClipCut.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: ClipCut for Android
          make_latest: false
          files: ClipCut.apk
