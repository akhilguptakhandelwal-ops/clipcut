name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Package the app into ClipCut.exe
        run: npm run build
      - name: Bundle ffmpeg next to the app
        shell: bash
        run: |
          node -e "const fs=require('fs');fs.copyFileSync(require('ffmpeg-static'),'dist/ffmpeg.exe');fs.copyFileSync(require('ffprobe-static').path,'dist/ffprobe.exe')"
          ls -la dist
      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=1.0.${{ github.run_number }}" installer\clipcut.iss
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: ClipCut-Setup
          path: dist/ClipCut-Setup.exe
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: ClipCut for Windows
          files: dist/ClipCut-Setup.exe
